[package]
name = "bluetooth-bs-fixer"
version = "1.1.0"
edition = "2021"
description = "Pick which Bluetooth adapter Windows uses and fix common Windows Bluetooth problems"
repository = "https://github.com/HRZNzero/WindowsBluetoothBSFixer"

[build-dependencies]
embed-manifest = "1.4"

[dependencies.windows-sys]
version = "=0.59.0"
features = [
    "Win32_Foundation",
    "Win32_Devices_Bluetooth",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
